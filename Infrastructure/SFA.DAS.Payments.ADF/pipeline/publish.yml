jobs:
- job: publishAdfFiles
  displayName: 'Publish ADF Files'

  # Explicitly load the variable group in this job/template.
  variables:
  - group: 'Common - Project Level'

  pool:
    name: 'DCT Build Pool'
    demands:
    - IsBuildServerDas

  workspace:
    clean: all

  steps:
  - checkout: self
    clean: true

  - task: gitversion/setup@0
    displayName: 'GitVersion'
    inputs:
      updateAssemblyInfo: true
      versionSpec: '5.x'

  - task: UseNode@1
    displayName: 'Use Node.js 20.x'
    inputs:
      version: '20.x'

  - task: PowerShell@2
    displayName: 'Validate ADF source factory setting'
    env:
      ADF_SOURCE_FACTORY_RESOURCE_ID: $(ADFSourceFactoryResourceId)
    inputs:
      targetType: 'inline'
      script: |
        $ErrorActionPreference = 'Stop'
        $factoryId = $env:ADF_SOURCE_FACTORY_RESOURCE_ID

        if ([string]::IsNullOrWhiteSpace($factoryId)) {
          throw 'ADFSourceFactoryResourceId is not defined or is empty in variable group Common - Project Level.'
        }

        Write-Host 'ADFSourceFactoryResourceId has been loaded successfully.'
        Write-Host "##vso[task.setvariable variable=ResolvedADFSourceFactoryResourceId]$factoryId"

  - task: Npm@1
    displayName: 'Install ADF utilities'
    inputs:
      command: 'install'
      workingDir: '$(Build.Repository.LocalPath)/Infrastructure/SFA.DAS.Payments.ADF'
      verbose: true

  - task: Npm@1
    displayName: 'Validate and generate ADF ARM template'
    inputs:
      command: 'custom'
      workingDir: '$(Build.Repository.LocalPath)/Infrastructure/SFA.DAS.Payments.ADF'
      customCommand: 'run build export "$(Build.Repository.LocalPath)/Infrastructure/SFA.DAS.Payments.ADF/adf" "$(ResolvedADFSourceFactoryResourceId)" "ArmTemplate"'

  - task: CopyFiles@2
    displayName: 'Copy files to artifact staging directory'
    inputs:
      SourceFolder: '$(Build.Repository.LocalPath)'
      Contents: |
        Infrastructure/SFA.DAS.Payments.ADF/azure/**
        Infrastructure/SFA.DAS.Payments.ADF/scripts/**
        Infrastructure/SFA.DAS.Payments.ADF/ArmTemplate/**
        das-at-dfac-df/**
      TargetFolder: '$(Build.ArtifactStagingDirectory)/publish'
      OverWrite: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish'
      ArtifactName: 'drop'
